
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint | RCMS</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav>
        <div class="logo">RCMS</div>
        <div>
            <a href="/">Home</a>
            <a href="/complaint.html">Submit Complaint</a>
        </div>
    </nav>

    <section>
        <h2 class="section-title">Submit a Complaint</h2>

        <form id="complaintForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <button type="button" class="btn" id="sendOtpBtn">
                Send Email OTP
            </button>

            <div id="otpSection" hidden>
                <label for="otp">Enter 6-digit OTP</label>
                <input type="text" id="otp" inputmode="numeric"
                       autocomplete="one-time-code" maxlength="6"
                       pattern="[0-9]{6}" placeholder="Enter OTP">

                <button type="button" class="btn" id="verifyOtpBtn">
                    Verify OTP
                </button>
            </div>

            <p id="verificationMessage" role="status"></p>

            <label for="category">Complaint Category</label>
            <select id="category" name="category" required>
                <option value="">Select a category</option>
                <option value="Food Quality">Food Quality</option>
                <option value="Service">Staff / Service</option>
                <option value="Cleanliness">Cleanliness</option>
                <option value="Billing">Billing Issue</option>
                <option value="Other">Other</option>
            </select>

            <label for="description">Complaint Description</label>
            <textarea id="description" name="description" rows="5"
                placeholder="Describe your complaint..." required></textarea>

            <button type="submit" class="btn" id="submitBtn" disabled>
                Verify Email First
            </button>

            <p id="formMessage" role="status"></p>
        </form>
    </section>

    <footer>
        <p>© 2026 Restaurant Complaint Management System</p>
    </footer>

    <script>
        const form = document.getElementById("complaintForm");
        const emailInput = document.getElementById("email");
        const otpInput = document.getElementById("otp");
        const otpSection = document.getElementById("otpSection");
        const sendOtpBtn = document.getElementById("sendOtpBtn");
        const verifyOtpBtn = document.getElementById("verifyOtpBtn");
        const submitBtn = document.getElementById("submitBtn");
        const verificationMessage =
            document.getElementById("verificationMessage");
        const formMessage = document.getElementById("formMessage");

        let verifiedEmail = "";

        function resetVerification(message = "") {
            verifiedEmail = "";
            otpInput.value = "";
            otpSection.hidden = true;
            submitBtn.disabled = true;
            submitBtn.textContent = "Verify Email First";
            verificationMessage.textContent = message;
        }

        emailInput.addEventListener("input", () => {
            resetVerification("Email changed. Verify your new email.");
        });

        sendOtpBtn.addEventListener("click", async () => {
            if (!emailInput.reportValidity()) return;

            sendOtpBtn.disabled = true;
            verificationMessage.textContent = "Sending OTP...";
            formMessage.textContent = "";

            try {
                const response = await fetch("/api/send-otp", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        email: emailInput.value.trim()
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Could not send OTP.");
                }

                otpSection.hidden = false;
                otpInput.focus();
                verificationMessage.textContent = data.message;
            } catch (error) {
                verificationMessage.textContent = error.message;
            } finally {
                sendOtpBtn.disabled = false;
            }
        });

        verifyOtpBtn.addEventListener("click", async () => {
            const email = emailInput.value.trim();
            const otp = otpInput.value.trim();

            if (!emailInput.reportValidity()) return;

            if (!/^\d{6}$/.test(otp)) {
                verificationMessage.textContent =
                    "Enter the six-digit OTP from your email.";
                return;
            }

            verifyOtpBtn.disabled = true;
            verificationMessage.textContent = "Verifying OTP...";

            try {
                const response = await fetch("/api/verify-otp", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "same-origin",
                    body: JSON.stringify({ email, otp })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "OTP verification failed.");
                }

                verifiedEmail = email.toLowerCase();
                submitBtn.disabled = false;
                submitBtn.textContent = "Submit Complaint";
                verificationMessage.textContent =
                    "Email verified successfully!";
            } catch (error) {
                verificationMessage.textContent = error.message;
            } finally {
                verifyOtpBtn.disabled = false;
            }
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            formMessage.textContent = "";

            if (
                !verifiedEmail ||
                verifiedEmail !== emailInput.value.trim().toLowerCase()
            ) {
                resetVerification("Please verify your email first.");
                return;
            }

            if (!form.reportValidity()) return;

            submitBtn.disabled = true;
            formMessage.textContent = "Submitting complaint...";

            try {
                const response = await fetch("/api/complaints", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        name: document.getElementById("name").value.trim(),
                        email: emailInput.value.trim(),
                        category: document.getElementById("category").value,
                        description:
                            document.getElementById("description").value.trim()
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Submission failed.");
                }

                formMessage.textContent =
                    data.message + " Your Complaint ID is: " +
                    data.complaintId;

                form.reset();
                resetVerification();
            } catch (error) {
                formMessage.textContent = error.message;
            } finally {
                submitBtn.disabled = !verifiedEmail;
                if (verifiedEmail) {
                    submitBtn.textContent = "Submit Complaint";
                }
            }
        });
    </script>
</body>
</html>
