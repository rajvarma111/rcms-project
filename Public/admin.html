
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | RCMS</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav>
        <div class="logo">RCMS Admin</div>
        <div>
            <a href="/">Home</a>
            <a href="/complaint.html">Submit Complaint</a>
            <a href="/view-complaints.html">View Complaints</a>
            <a href="/track-complaint.html">Track Complaint</a>
            <button type="button" class="btn" id="logoutBtn">
                Logout
            </button>
        </div>
    </nav>

    <section>
        <h2 class="section-title">Admin Dashboard</h2>
        <p>Review submitted complaints and update their status.</p>

        <p id="adminMessage" role="status"></p>

        <div id="adminComplaints">
            <p>Checking admin login...</p>
        </div>
    </section>

    <footer>
        <p>© 2026 Restaurant Complaint Management System</p>
    </footer>

    <script>
        const container = document.getElementById("adminComplaints");
        const message = document.getElementById("adminMessage");
        const logoutBtn = document.getElementById("logoutBtn");

        async function checkAdmin() {
            try {
                const response = await fetch("/api/admin/check", {
                    credentials: "same-origin"
                });

                if (!response.ok) {
                    window.location.replace("/admin-login.html");
                    return false;
                }

                return true;
            } catch (error) {
                container.textContent = "Unable to check admin login.";
                return false;
            }
        }

        async function loadComplaints() {
            if (!(await checkAdmin())) return;

            container.textContent = "Loading complaints...";

            try {
                const response = await fetch("/api/complaints", {
                    credentials: "same-origin"
                });

                if (!response.ok) {
                    throw new Error("Could not load complaints.");
                }

                const complaints = await response.json();
                container.replaceChildren();

                if (complaints.length === 0) {
                    container.textContent = "No complaints found.";
                    return;
                }

                complaints.forEach(function (complaint) {
                    const card = document.createElement("div");
                    card.className = "complaint-card";

                    const title = document.createElement("h3");
                    title.textContent = "Complaint ID: " + complaint.id;

                    const name = document.createElement("p");
                    name.textContent = "Name: " + complaint.name;

                    const email = document.createElement("p");
                    email.textContent = "Email: " + complaint.email;

                    const category = document.createElement("p");
                    category.textContent = "Category: " + complaint.category;

                    const description = document.createElement("p");
                    description.textContent =
                        "Description: " + complaint.description;

                    const currentStatus = document.createElement("p");
                    currentStatus.textContent =
                        "Current status: " + complaint.status;

                    const label = document.createElement("label");
                    label.textContent = "Update status: ";

                    const select = document.createElement("select");
                    select.id = "status-" + complaint.id;
                    label.htmlFor = select.id;

                    ["Pending", "In Progress", "Resolved"].forEach(
                        function (status) {
                            const option = document.createElement("option");
                            option.value = status;
                            option.textContent = status;
                            select.appendChild(option);
                        }
                    );

                    select.value = complaint.status;

                    const saveButton = document.createElement("button");
                    saveButton.type = "button";
                    saveButton.className = "btn";
                    saveButton.textContent = "Save Status";

                    saveButton.addEventListener("click", async function () {
                        saveButton.disabled = true;
                        message.textContent = "Saving status...";

                        try {
                            const updateResponse = await fetch(
                                "/api/complaints/" +
                                    encodeURIComponent(complaint.id) +
                                    "/status",
                                {
                                    method: "PATCH",
                                    credentials: "same-origin",
                                    headers: {
                                        "Content-Type": "application/json"
                                    },
                                    body: JSON.stringify({
                                        status: select.value
                                    })
                                }
                            );

                            const result = await updateResponse.json();

                            if (!updateResponse.ok) {
                                if (updateResponse.status === 401) {
                                    window.location.replace("/admin-login.html");
                                    return;
                                }
                                throw new Error(
                                    result.message || "Status update failed."
                                );
                            }

                            message.textContent =
                                "Complaint status updated successfully.";

                            await loadComplaints();
                        } catch (error) {
                            message.textContent = error.message;
                        } finally {
                            saveButton.disabled = false;
                        }
                    });

                    card.append(
                        title,
                        name,
                        email,
                        category,
                        description,
                        currentStatus,
                        label,
                        select,
                        document.createElement("br"),
                        saveButton
                    );

                    container.appendChild(card);
                });
            } catch (error) {
                container.textContent = "Unable to load complaints.";
                message.textContent = error.message;
            }
        }

        logoutBtn.addEventListener("click", async function () {
            logoutBtn.disabled = true;
            message.textContent = "Logging out...";

            try {
                const response = await fetch("/api/admin/logout", {
                    method: "POST",
                    credentials: "same-origin"
                });

                if (!response.ok) {
                    throw new Error("Logout failed. Please try again.");
                }

                window.location.replace("/admin-login.html");
            } catch (error) {
                message.textContent = error.message;
                logoutBtn.disabled = false;
            }
        });

        loadComplaints();
    </script>

</body>
</html>
